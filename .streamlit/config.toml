[browser]
# No usage telemetry leaves the machine.
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
# Light, clean investing-app look with our own green accent (not Groww's brand colour).
base = "light"
primaryColor = "#0E9F6E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F8"
textColor = "#1F2937"
font = "sans serif"
